<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 - SomeWhere社区</title>
<meta name="description" content="SomeWhere社区用户管理后台（管理员专用）。">

<link rel="stylesheet" href="common.css?v=20261029">

</head>
<body>
<div class="nav" id="nav"></div>

<div class="page" style="flex-direction:column;max-width:980px" id="userPage">
  <div class="card" style="width:100%">
    <div class="card-title" data-icon="user">用户管理（信用分 / 封禁） <span class="hint" id="userMeta"></span></div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #eeeeee">
      <div style="flex:1;min-width:200px">
        <div class="hint" style="margin:0 0 4px">搜索（用户名 / 昵称）</div>
        <input class="form-input" id="kwInput" style="width:100%" placeholder="输入关键字后回车或点查询" onkeydown="if(event.key==='Enter')loadUsers()">
      </div>
      <div style="min-width:160px">
        <div class="hint" style="margin:0 0 4px">手机号</div>
        <input class="form-input" id="phoneInput" style="width:100%" placeholder="精确/模糊搜索手机号" onkeydown="if(event.key==='Enter')loadUsers()">
      </div>
      <div>
        <div class="hint" style="margin:0 0 4px">排序</div>
        <select class="form-input" id="sortSel" style="min-width:150px">
          <option value="id" selected>ID</option>
          <option value="credit">信用分（高→低）</option>
          <option value="violations">违规次数（多→少）</option>
          <option value="username">用户名</option>
          <option value="created">注册时间（新→旧）</option>
          <option value="status">状态</option>
        </select>
      </div>
      <button class="btn primary" onclick="loadUsers()" data-icon="search">查询</button>
      <button class="btn" onclick="resetSearch()">重置</button>
    </div>

    <table class="grid">
      <thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>手机号</th><th>角色</th><th>信用分</th><th>违规次数</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody id="userBody"><tr><td colspan="10" style="text-align:center;color:var(--fg-3)">加载中...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- 封禁弹窗 -->
<div id="banModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:99;align-items:center;justify-content:center">
  <div style="background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:18px 20px;width:min(420px,90vw)">
    <div style="font-weight:700;margin-bottom:12px" data-icon="ban">封禁用户 <span id="banTarget" style="color:var(--fg-2)"></span></div>
    <div class="hint" style="margin:0 0 6px">封禁原因</div>
    <input class="form-input" id="banReason" maxlength="200" placeholder="如：多次违规 / 恶意行为" style="margin-bottom:8px">
    <div class="hint" style="margin:0 0 6px">封禁时长（天），0 表示永久封禁</div>
    <input class="form-input" id="banDays" type="number" min="0" max="365" value="0" style="margin-bottom:14px">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" onclick="closeBanModal()">取消</button>
      <button class="btn danger" onclick="doBan()" data-icon="ban">确认封禁</button>
    </div>
  </div>
</div>

<script src="icons.js?v=20261029"></script>
<script src="api.js?v=20261029"></script>
<script src="ui.js?v=20261029"></script>
<script>
renderNav();
const u = currentUser();
if (!u || u.role !== 'admin') {
  document.getElementById('userPage').innerHTML = '<div class="card" style="width:100%"><div class="empty-tip">需要管理员权限（默认账号 admin / admin123）。<br><br><a href="login.html"><button class="btn primary">' + getIcon('user', 14) + ' 去登录</button></a></div></div>';
} else {
  loadUsers();
}

function resetSearch() {
  document.getElementById('kwInput').value = '';
  document.getElementById('phoneInput').value = '';
  document.getElementById('sortSel').value = 'id';
  loadUsers();
}

function userQuery() {
  const p = new URLSearchParams({ page: 1, page_size: 50 });
  const kw = document.getElementById('kwInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  const sort = document.getElementById('sortSel').value;
  if (kw) p.set('keyword', kw);
  if (phone) p.set('phone', phone);
  p.set('sort', sort);
  return p.toString();
}

async function loadUsers() {
  const el = document.getElementById('userBody');
  try {
    const res = await API.get('/api/admin/users?' + userQuery());
    document.getElementById('userMeta').textContent = `共 ${res.total} 个用户`;
    if (!res.items.length) { el.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--fg-3)">暂无用户</td></tr>'; return; }
    el.innerHTML = res.items.map(x => `
      <tr data-id="${x.id}">
        <td>${x.id}</td>
        <td>${esc(x.username)}</td>
        <td>${x.id ? userLink(x.id, esc(x.nickname || '')) : esc(x.nickname || '')}</td>
        <td>${esc(x.phone || '-')}</td>
        <td>${x.role === 'admin' ? '<span class="chip blocked">管理员</span>' : '<span class="chip warned">用户</span>'}</td>
        <td style="color:${x.credit_score < 60 ? '#ffffff' : '#bbbbbb'};font-weight:700">${x.credit_score}</td>
        <td style="color:${(x.violation_count || 0) > 0 ? '#ffffff' : '#888888'};font-weight:700">${x.violation_count ?? 0}</td>
        <td>${x.status === 'banned'
          ? `<span class="chip blocked">已封禁</span><div class="hint" style="margin:0">${x.banned_until ? '至 ' + esc(x.banned_until) : '永久'}${x.banned_reason ? ' · ' + esc(x.banned_reason) : ''}</div>`
          : '<span class="chip ok">正常</span>'}</td>
        <td>${timeAgo(x.created_at)}</td>
        <td style="white-space:nowrap">
          ${x.status === 'banned' || x.credit_score <= 0
            ? `<button class="btn sm" style="background:#ffffff;color:#000000;border-color:#ffffff" onclick="unbanUser(${x.id})">解封</button>`
            : `<button class="btn danger sm" onclick="openBanModal(${x.id},'${esc(x.nickname || x.username || '')}')">${getIcon('ban', 13)} 封禁</button>`}
        </td>
      </tr>`).join('');
  } catch (e) {
    el.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--fg-3)">加载失败：${esc(e.message)}</td></tr>`;
  }
}

let banUid = 0;
function openBanModal(id, name) {
  banUid = id;
  document.getElementById('banTarget').textContent = '#' + id + ' ' + name;
  document.getElementById('banReason').value = '';
  document.getElementById('banDays').value = 0;
  document.getElementById('banModal').style.display = 'flex';
}
function closeBanModal() {
  document.getElementById('banModal').style.display = 'none';
}
async function doBan() {
  const reason = document.getElementById('banReason').value.trim();
  const days = Math.max(0, Math.min(365, Number(document.getElementById('banDays').value) || 0));
  try {
    await API.post('/api/admin/users/' + banUid + '/ban', { action: 'ban', reason, duration_hours: days * 24 });
    showToast('已封禁该用户（' + (days === 0 ? '永久' : days + ' 天') + '）', 'error');
    closeBanModal();
    loadUsers();
  } catch (e) { showToast(e.message, 'error'); }
}

async function unbanUser(id) {
  if (!confirm('确认解封该用户？')) return;
  try {
    await API.post('/api/admin/users/' + id + '/ban', { action: 'unban' });
    showToast('已解封该用户', 'success');
    loadUsers();
  } catch (e) { showToast(e.message, 'error'); }
}
</script>
</body>
</html>
