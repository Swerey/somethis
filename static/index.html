<style>

/* ===== 批次A-1：设计变量（黑白基调，改主题只动此处） ===== */
:root {
  --bg: #f2f3f5;
  --bg-soft: #fafbfc;
  --fg: #111111;
  --fg-2: #555555;
  --fg-3: #999999;
  --primary: #111315;
  --primary-hover: #000000;
  --border: #e4e7ec;
  --border-soft: #eef0f3;
  --border-strong: #d0d4da;
  --radius: 12px;
  --radius-sm: 8px;
  --gap: 16px;
  --card-pad: 18px;
  --transition: all .2s ease;
  --danger: #c62828;
  --success: #16a34a;
  --warning: #b45309;
  --nav-bg: #111315;
  --nav-fg: #fafcff;
}
/* 虎扑式综合交流平台 - 黑白基调 + 多元化彩色点缀公共样式（Marvis 风） */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--fg); }
a { color: var(--fg-2); text-decoration: none; }
a:hover { color: var(--primary-hover); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--fg-3); border-radius: 3px; }

/* 顶部导航（黑白基调，保持品牌） */
.nav { position: sticky; top: 0; z-index: 100; background: var(--primary); border-bottom: 2px solid var(--primary-hover); box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 10px 18px; }
.logo { font-size: 20px; font-weight: 900; color: #fafcff; letter-spacing: 2px; text-shadow: 0 0 8px rgba(255,255,255,.22); }
.logo small { font-size: 11px; color: var(--fg-3); font-weight: 400; margin-left: 6px; }
.nav-search { flex: 1; max-width: 360px; display: flex; }
.nav-search input { flex: 1; background: #1c1f24; border: 1px solid #4a4f58; border-radius: var(--radius-sm) 0 0 8px; color: var(--border-soft); padding: 7px 12px; font-size: 13px; outline: none; }
.nav-search input:focus { border-color: #ffffff; }
.nav-search button { background: #ffffff; border: 1px solid #ffffff; border-radius: 0 8px 8px 0; color: var(--primary-hover); padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.nav-search button:hover { background: var(--border-strong); }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: var(--gap); font-size: 13px; }
.nav-right .user { display: flex; align-items: center; gap: 12px; }
.nav-right .user > *, .nav-right .btn { flex-shrink: 0; white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--fg-2), var(--fg-2)); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; color: #ffffff; border: 1px solid var(--fg-3); }
.user-link { color: inherit; text-decoration: none; cursor: pointer; }
.user-link:hover { color: var(--fg); text-decoration: underline; }
.post-card .post-title a, .video-card .v-title a { color: inherit; text-decoration: none; }
.post-card .post-title a:hover, .video-card .v-title a:hover { color: var(--fg); text-decoration: underline; }
.post-summary { font-size: 13px; color: var(--fg-2); line-height: 1.7; background: var(--bg-soft); border-left: 3px solid var(--border-strong); padding: 8px 12px; margin-bottom: var(--gap); border-radius: 0 8px 8px 0; }
.post-summary-empty { color: var(--fg-3); font-style: italic; }
.credit { color: var(--border-strong); font-weight: 700; }
.btn { background: #ffffff; color: var(--fg); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 6px 14px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); }
.btn:hover { background: #e8eaee; color: var(--primary-hover); }
.btn.primary { background: var(--primary); color: #ffffff; border-color: var(--primary); font-weight: 700; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.danger { background: #ffffff; color: var(--danger); border: 2px solid var(--danger); font-weight: 700; }
.btn.danger:hover { background: var(--danger); color: #ffffff; }
.btn.sm { padding: 3px 10px; font-size: 12px; }
.btn.logout { background: transparent; color: #ffb4b4; border: 1px solid var(--danger); }
.btn.logout:hover { background: var(--danger); color: #ffffff; }

/* 板块导航（分类 Tab：横向滚动 + 彩色点缀） */
.cats { background: #ffffff; border-bottom: 1px solid var(--border); }
.cats-inner { max-width: 1200px; margin: 0 auto; display: flex; gap: 4px; padding: 8px 18px; overflow-x: auto; scrollbar-width: thin; }
.cats a { padding: 6px 16px; border-radius: 999px; font-size: 14px; color: var(--fg-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); }
.cats a:hover { background: var(--bg-soft); color: var(--primary-hover); }
.cats a.active { background: var(--primary); color: #ffffff; font-weight: 700; }
.cats a .cat-fa { font-size: 13px; }

/* 双栏布局 */
.page { max-width: 1200px; margin: var(--gap) auto; padding: 0 18px; display: flex; gap: var(--gap); align-items: flex-start; }
.main-col { flex: 1; min-width: 0; }
.side-col { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }

/* 卡片（白底圆角留白） */
.card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius); padding: var(--card-pad); margin-bottom: var(--gap); box-shadow: 0 1px 4px rgba(17,19,21,.05); }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: var(--gap); display: flex; align-items: center; gap: 8px; color: var(--fg); padding-bottom: 10px; border-bottom: 1px solid var(--border-soft); }
.card-title .ct-icon { font-size: 15px; color: var(--primary); }
.card-title .hot-tag { background: var(--primary); color: #ffffff; font-size: 11px; padding: 1px 8px; border: 1px solid var(--primary); border-radius: 4px; font-weight: 700; margin-left: auto; }

/* tab 切换 */
.tabs { display: flex; gap: 8px; margin-bottom: var(--gap); }
.tabs a, .tabs .tab-btn { padding: 6px 18px; border-radius: 999px; font-size: 14px; color: var(--fg-2); background: #ffffff; border: 1px solid var(--border-strong); cursor: pointer; }
.tabs a.active, .tabs .tab-btn.active { background: var(--primary); color: #ffffff; font-weight: 700; border-color: var(--primary); }

/* 帖子卡片 */
.post-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius); padding: var(--card-pad); margin-bottom: 12px; cursor: pointer; transition: var(--transition); }
.post-card:hover { border-color: var(--border-strong); box-shadow: 0 4px 14px rgba(17,19,21,.08); }
.post-card .post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.post-card .post-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--fg); }
.post-card .post-excerpt { font-size: 13px; color: var(--fg-2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
.post-card .post-meta { display: flex; gap: 14px; font-size: 12px; color: var(--fg-3); align-items: center; }
.post-card .cat-chip { background: var(--bg-soft); font-size: 11px; padding: 1px 10px; border: 1px solid var(--border-strong); border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 4px; font-weight: 700; }
.chip.folded { background: var(--bg-soft); color: var(--fg-2); }
.chip.warned { background: #ffffff; color: var(--warning); border: 1px solid var(--warning); }
.chip.blocked { background: var(--primary); color: #ffffff; border: 1px solid var(--primary); }
.folded-line { color: var(--fg-2); font-size: 12px; padding: 6px 10px; background: var(--bg-soft); border: 1px dashed var(--fg-3); border-radius: 6px; margin: 6px 0; }

/* 视频卡片（彩色封面 + 播放遮罩） */
.video-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius); padding: var(--card-pad); margin-bottom: 12px; cursor: pointer; transition: var(--transition); display: flex; gap: 12px; }
.video-card:hover { border-color: var(--border-strong); box-shadow: 0 4px 14px rgba(17,19,21,.08); }
.video-thumb { position: relative; width: 168px; height: 94px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--bg-soft), var(--border-strong)); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; color: #ffffff; border: 1px solid var(--border); overflow: hidden; }
.video-thumb .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.video-thumb .play-mask { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(17,19,21,.28); color: #ffffff; }
.video-card .v-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--fg); }
.video-card .v-desc { font-size: 12px; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.video-card .v-meta { margin-top: 8px; font-size: 12px; color: var(--fg-3); }

/* 侧栏列表 */
.rank-list { list-style: none; }
.rank-list li { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border-soft); font-size: 13px; cursor: pointer; }
.rank-list li:last-child { border-bottom: none; }
.rank-list .rk { width: 22px; height: 22px; border-radius: 50%; background: var(--bg-soft); color: var(--fg-2); font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--border-strong); }
.rank-list li:nth-child(1) .rk { background: var(--primary); color: #ffffff; font-weight: 800; border-color: var(--primary); }
.rank-list li:nth-child(2) .rk { background: var(--fg-3); color: #ffffff; font-weight: 700; border-color: var(--fg-3); }
.rank-list li:nth-child(3) .rk { background: var(--fg-3); color: var(--fg); font-weight: 700; border-color: var(--fg-3); }
.rank-list .r-main { flex: 1; min-width: 0; }
.rank-list .r-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.rank-list .r-sub { font-size: 11px; color: var(--fg-3); margin-top: 2px; }

/* 健康度卡片 */
.health-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.health-item { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
.health-item .num { font-size: 20px; font-weight: 700; color: var(--primary); }
.health-item .num.red { color: var(--danger); font-weight: 800; }
.health-item .num.green { color: var(--success); }
.health-item .num.orange { color: var(--warning); }
.health-item .lbl { font-size: 11px; color: var(--fg-3); margin-top: 4px; }

/* 底部违规拦截滚动条 */
.marquee-wrap { position: fixed; bottom: 0; left: 0; right: 0; background: var(--primary); border-top: 2px solid var(--primary-hover); overflow: hidden; z-index: 90; padding: 6px 0; }
.marquee-inner { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; font-size: 12px; color: var(--fg-3); }
.marquee-inner span { margin-right: 40px; }
.marquee-inner .bad-word { color: #ffffff; font-weight: 800; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* 表单 */
.form-group { margin-bottom: var(--gap); }
.form-group label { display: block; font-size: 13px; color: var(--fg-2); margin-bottom: 6px; }
.form-input { width: 100%; background: #ffffff; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--fg); padding: 9px 12px; font-size: 14px; outline: none; transition: var(--transition); }
.form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(17,19,21,.08); }
textarea.form-input { min-height: 140px; resize: vertical; line-height: 1.7; }
select.form-input { appearance: auto; }
.hint { font-size: 12px; color: var(--fg-3); margin-top: 6px; }
.hint.danger { color: var(--danger); font-weight: 700; }
.hint.ok { color: var(--success); }

/* 弹幕层 */
.stage { position: relative; background: #000; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; aspect-ratio: 16/9; }
.stage video, .stage img { width: 100%; height: 100%; object-fit: contain; display: block; }
.danmaku { position: absolute; white-space: nowrap; font-size: 16px; font-weight: 600; text-shadow: 1px 1px 3px rgba(0,0,0,.9); will-change: transform; color: #ffffff; pointer-events: none; }
.danmaku.folded { color: var(--fg-3); text-decoration: line-through; opacity: .85; }
.danmaku.warned { color: #fde68a; border-bottom: 1px dashed var(--warning); }

/* 评论 */
.comment { padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
.comment:last-child { border-bottom: none; }
.comment .c-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.comment .c-name { font-size: 13px; color: var(--fg); font-weight: 600; }
.comment .c-time { font-size: 11px; color: var(--fg-3); }
.comment .c-body { font-size: 14px; line-height: 1.7; color: var(--fg); }
.comment .c-body.folded { color: var(--fg-3); }
.comment .c-body.warned { border-left: 3px solid var(--warning); padding-left: 8px; }

/* 弹窗/提示 */
.alert-bar { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #ffffff; padding: 10px 22px; border: 1px solid var(--primary); border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,.35); }
.alert-bar.ok { background: var(--success); border-color: var(--success); }
.alert-bar.error { background: var(--danger); border-color: var(--danger); }
.alert-bar.warning { background: var(--warning); border-color: var(--warning); }
.empty-tip { color: var(--fg-3); font-size: 13px; text-align: center; padding: 40px 0; }

/* 图表容器 */
.chart-box { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
.chart-box canvas { max-height: 240px; }

/* 表格 */
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th, table.grid td { padding: 8px 10px; border-bottom: 1px solid var(--border-soft); text-align: left; color: var(--fg); }
table.grid th { color: var(--fg-2); font-weight: 600; background: var(--bg-soft); }

/* 首页发布入口 */
.publish-entry { margin-bottom: var(--gap); display: flex; gap: 10px; flex-wrap: wrap; }
.publish-entry a { padding: 10px 26px; font-size: 14px; font-weight: 700; border-radius: var(--radius-sm); background: var(--primary); color: #ffffff; border: 1px solid var(--primary); display: inline-flex; align-items: center; gap: 8px; }
.publish-entry a:hover { background: var(--primary-hover); }

/* 导航链接（桌面横排，移动端折叠进汉堡） */
.nav-links { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; }
.nav-links a { padding: 6px 12px; font-size: 14px; color: #c3c8cf; white-space: nowrap; border-radius: var(--radius-sm); display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); }
.nav-links a .nav-fa { font-size: 14px; }
.nav-links a:hover { color: #ffffff; background: #24282e; }
.nav-links a.active { color: #ffffff; font-weight: 700; background: #24282e; }
.nav-sep { width: 1px; height: 20px; background: #33373e; margin: 0 8px; flex: none; align-self: center; }
.nav-toggle { display: none; background: none; border: 1px solid #4a4f58; border-radius: var(--radius-sm); color: #ffffff; font-size: 18px; line-height: 1; padding: 6px 10px; cursor: pointer; }

/* 申诉弹窗 */
.appeal-mask { position: fixed; inset: 0; background: rgba(17,19,21,.62); z-index: 998; display: flex; align-items: center; justify-content: center; padding: 20px; }
.appeal-box { width: 100%; max-width: 420px; background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius); padding: var(--card-pad); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.appeal-box textarea { min-height: 90px; }

/* 响应式：≥768px 横排（默认）；<768px 汉堡抽屉 + 分类二级折叠 */
.cat-group .cat-sub { display: none; }

@media (min-width: 768px) {
  .nav-toggle { display: none !important; }
  .nav-links { display: flex !important; }
}

@media (max-width: 768px) {
  body { font-size: 14px; overflow-x: hidden; }
  .nav-inner { flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
  .nav-toggle { display: block; }
  .logo { font-size: 18px; }
  .logo small { display: none; }
  .nav-links { display: none; flex-basis: 100%; order: 5; flex-direction: column; align-items: stretch; gap: 0; max-height: 60vh; overflow-y: auto; }
  .nav-links a { border-bottom: 1px solid var(--fg); padding: 10px 14px; font-size: 15px; border-radius: 0; justify-content: flex-start; }
  .nav-links a.active { background: var(--fg); }
.nav-sep { width: auto; height: 1px; background: var(--fg); margin: 8px 14px; }
  .nav-right { display: none; flex-basis: 100%; order: 6; margin-left: 0; justify-content: flex-end; padding-top: 8px; border-top: 1px solid #2a2e34; }
  .nav-right .user { flex-wrap: wrap; justify-content: flex-end; }
  .nav-open .nav-links, .nav-open .nav-right { display: flex; }

  /* 分类 Tab：横向滚动 + 二级折叠 */
  .cats-inner { flex-wrap: nowrap; overflow-x: auto; padding: 6px 10px; }
  .cats a { padding: 6px 12px; font-size: 13px; }
  .cat-group { display: contents; }
  .cat-group .cat-sub { display: none; }
  .cat-group.open .cat-sub { display: contents; }

  .nav-search { flex-basis: auto; flex: 1; min-width: 0; max-width: none; }
  .nav-search input { min-width: 0; }

  .page { flex-direction: column; padding: 0 10px; gap: 10px; }
  .main-col { width: 100%; }
  .side-col { width: 100%; flex-shrink: 0; }
  .card { padding: var(--card-pad); margin-bottom: var(--gap); }
  .cats-inner { padding: 6px 10px; }

  .video-card { flex-direction: column; }
  .video-thumb { width: 100%; height: auto; aspect-ratio: 16/9; }
  .post-card .post-title { font-size: 15px; }
  .health-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }

  table.grid { font-size: 12px; display: block; overflow-x: auto; white-space: nowrap; }
  .tabs a, .tabs .tab-btn { padding: 6px 12px; font-size: 13px; }
  .marquee-wrap { display: none; }

  /* 移动端弹幕舞台与操作区（批次二） */
  .stage { border-radius: var(--radius-sm); }
  .stage.dm-stage, .stage { min-height: 40vh; }
  .danmaku { font-size: 14px; }
  .stage .danmaku { cursor: pointer; }
  .form-input { font-size: 14px; }
  .btn { padding: 6px 10px; font-size: 13px; }
  .comment .c-head { flex-wrap: wrap; gap: 6px; }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .card-title { font-size: 15px; }
  .nav-links a, .nav-right { font-size: 14px; }
}


/* ===== 主页推荐轮播 ===== */
.carousel {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 7;
  max-height: 420px;
  border-radius: var(--radius);
  overflow: hidden;
  background: #1a1c1e;
  margin-bottom: var(--gap);
  user-select: none;
}
.carousel-track { position: relative; width: 100%; height: 100%; }
.carousel-slide {
  position: absolute; inset: 0;
  display: block;
  width: 100%; height: 100%;
  background: #1a1c1e;
  opacity: 0;
  visibility: hidden;
  transform: translateX(24px);
  transition: opacity .5s ease, transform .5s ease, visibility .5s;
  text-decoration: none;
  overflow: hidden;
}
.carousel-slide.active { opacity: 1; visibility: visible; transform: translateX(0); }
.carousel-img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(18%) contrast(1.05); }
.carousel-slide.no-cover { background: linear-gradient(135deg,#1a1c1e 0%,#26282b 100%); }
.carousel-ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    linear-gradient(135deg, rgba(255,255,255,.04) 25%, transparent 25%) 0 0 / 28px 28px,
    linear-gradient(315deg, rgba(255,255,255,.04) 25%, transparent 25%) 0 0 / 28px 28px,
    linear-gradient(135deg, #222427, #2a2d30);
}
.ph-glyph { width: 72px; height: 72px; border-radius: 50%; background: #33363a; color: var(--fg-3); display: flex; align-items: center; justify-content: center; }
.carousel-info {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 34px 28px 20px;
  background: linear-gradient(to top, rgba(10,12,14,.92) 0%, rgba(10,12,14,.55) 55%, transparent 100%);
  color: var(--bg);
}
.carousel-tag {
  display: inline-block; font-size: 11px; line-height: 1;
  padding: 3px 8px; border-radius: 3px; margin-bottom: 8px;
  background: #ffffff; color: var(--primary); letter-spacing: .5px;
}
.carousel-title { font-size: 21px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
.carousel-summary { font-size: 13px; color: #b9bec4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.carousel-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.14); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); opacity: 0; transition: opacity .25s, background .25s;
  z-index: 5;
}
.carousel:hover .carousel-arrow { opacity: 1; }
.carousel-arrow.left { left: 12px; }
.carousel-arrow.right { right: 12px; }
.carousel-arrow:hover { background: rgba(255,255,255,.3); }
.carousel-dots {
  position: absolute; right: 16px; bottom: 14px; z-index: 5;
  display: flex; gap: 6px;
}
.carousel-dot {
  width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.35);
  cursor: pointer; transition: width .3s, background .3s;
}
.carousel-dot.active { width: 18px; background: #fff; }

@media (max-width: 768px) {
  .carousel-title { font-size: 17px; }
  .carousel-summary { -webkit-line-clamp: 1; }
  .carousel-info { padding: 22px 16px 16px; }
  .carousel-arrow { width: 30px; height: 30px; }
}
@media (max-width: 480px) {
  .carousel-arrow { display: none; }
  .carousel-dots { right: 10px; bottom: 10px; }
}

/* ===== 批次A-2：对比度强化（主按钮反白块/次级降透明度/3档灰阶） ===== */
.btn.primary { background: var(--fg); color: #ffffff; border: 2px solid var(--fg); font-weight: 800; }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); transform: translateY(-1px); }
.btn:not(.primary):not(.danger) { background: rgba(255,255,255,.72); border-color: var(--border-strong); color: var(--fg-2); }
.btn:not(.primary):not(.danger):hover { background: var(--bg-soft); color: var(--fg); }

/* ===== 批次A-3：hover 微提升 + 边框变化 ===== */
.post-card:hover, .video-card:hover, .source-opt:hover, .card:hover, .health-item:hover, .rank-list li:hover {
  transform: translateY(-1px);
  border-color: var(--border-strong);
  .tabs a, .tabs .tab-btn { min-height: 44px; padding-top: 10px; padding-bottom: 10px; }
  .nav-toggle { min-width: 44px; min-height: 44px; }
  .rank-list li { padding-top: 12px; padding-bottom: 12px; }
  .publish-entry a { min-height: 44px; }
  .source-opt { padding: 12px; }
}

/* ===== 批次C-1：移动端底部 Tab（5 项内） ===== */
@media (max-width: 768px) {
  .bottom-tab { display: none; }
}
.bottom-tab {
  display: none;
}

</style>
</head>
<body>
<div class="nav" id="nav"></div>

<div class="page">
  <div class="main-col">
    <div class="carousel" id="carousel" style="display:none">
      <div class="carousel-track" id="carouselTrack"></div>
      <button class="carousel-arrow left" id="carouselPrev" aria-label="上一张"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="carousel-arrow right" id="carouselNext" aria-label="下一张"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="latest" onclick="switchTab('latest')">最新</button>
      <button type="button" class="tab-btn" data-tab="hot" onclick="switchTab('hot')">精华热榜</button>
    </div>
    <div class="publish-entry">
      <a href="publish.html" class="btn primary" data-icon="post">发布帖子</a>
      <a href="publish.html?tab=video" class="btn" data-icon="upload">上传视频</a>
    </div>
    <div id="feed"><div class="empty-tip">加载中...</div></div>
  </div>

  <div class="side-col">
    <div class="card">
      <div class="card-title" data-icon="post">帖子热榜 <span class="hot-tag">HOT</span></div>
      <ol class="rank-list" id="hotList"><div class="empty-tip">加载中...</div></ol>
    </div>
    <div class="card">
      <div class="card-title" data-icon="ban">违规热词榜</div>
      <ol class="rank-list" id="wordList"><div class="empty-tip">加载中...</div></ol>
    </div>
    <div class="card">
      <div class="card-title" data-icon="settings">平台健康度</div>
      <div class="health-grid" id="healthBox">
        <div class="health-item"><div class="num" id="hToday">-</div><div class="lbl">今日拦截</div></div>
        <div class="health-item"><div class="num" id="hRate">-</div><div class="lbl">拦截率</div></div>
        <div class="health-item"><div class="num" id="hLat">-</div><div class="lbl">平均延迟 ms</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title" data-icon="user">活跃用户榜</div>
      <ol class="rank-list" id="userList"><div class="empty-tip">加载中...</div></ol>
    </div>
  </div>
</div>

<div class="marquee-wrap"><div class="marquee-inner" id="marquee"></div></div>

<script src="icons.js?v=20261029"></script>
<script src="api.js?v=20261029"></script>
<script src="ui.js?v=20261029"></script>
<script>
renderNav('index');
const params = new URLSearchParams(location.search);
const cat = params.get('cat') || '推荐';
let tab = params.get('tab') || 'latest';
const q = (params.get('q') || '').trim();
applyTabUI();

/** 纯前端切换 最新/精华热榜：不刷新页面、保留滚动位置，仅同步 URL 参数 */
function switchTab(t) {
  if (t === tab) return;
  tab = t;
  applyTabUI();
  history.replaceState(null, '', 'index.html' + (tab === 'hot' ? '?tab=hot' : ''));
  loadFeed();
}

function applyTabUI() {
  document.querySelectorAll('.tabs .tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
}

let feedPage = 0;
let feedTotal = 0;
const feedPageSize = 20;

async function loadFeed() {
  const el = document.getElementById('feed');
  try {
    await fetchFeedPage(1, true);
    setupInfiniteScroll({
      container: el,
      hasMore: () => feedPage * feedPageSize < feedTotal,
      loadMore: async () => { await fetchFeedPage(feedPage + 1, false); },
    });
  } catch (e) {
    if (!e._toasted) showToast(e.message, 'error');
    renderEmpty(el, '加载失败：' + esc(e.message));
  }
}

async function fetchFeedPage(page, reset) {
  const el = document.getElementById('feed');
  const [postsRes, videosRes] = await Promise.all([
    API.get(`/api/posts?tab=${tab}&category=${encodeURIComponent(cat)}&page=${page}&page_size=${feedPageSize}`),
    API.get(`/api/videos?page=${page}&page_size=${feedPageSize}`),
  ]);
  let items = [];
  postsRes.items.forEach(p => items.push({ kind: 'post', ...p }));
  videosRes.items.forEach(v => items.push({ kind: 'video', ...v }));
  items.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  if (q) items = items.filter(it => (it.title + ' ' + (it.content || '') + ' ' + (it.description || '')).toLowerCase().includes(q.toLowerCase()));
  if (reset) {
    el._all = [];
    feedTotal = Math.max(postsRes.total || 0, videosRes.total || 0);
  }
  const all = el._all || [];
  items.forEach(it => { if (!all.some(x => x.kind === it.kind && x.id === it.id)) all.push(it); });
  all.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  el._all = all;
  feedPage = page;
  if (!all.length) { renderEmpty(el, '暂无内容，去发一帖吧'); return; }
  el.innerHTML = all.map(it => it.kind === 'post' ? postCard(it) : videoCard(it)).join('');
}

function postCard(p) {
  const folded = p.status === 'folded' ? '<div class="folded-line">该帖疑似违规（中危）已折叠，点击查看</div>' : '';
  const warned = p.status === 'warned' ? '<span class="chip warned">低危提示</span>' : '';
  return `<div class="post-card" onclick="location.href='post.html?id=${p.id}'">
    <div class="post-head">${userLink(p.user_id, `<span class="avatar">${esc((p.nickname || '?').slice(0, 1))}</span><span style="font-size:13px;color:var(--fg-2)">${esc(p.nickname || '')}</span>`)}
      <span class="cat-chip" style="color:${catColor(p.category)};border-color:${catColor(p.category)};background:${catColor(p.category)}1a">${getIcon('post', 12)} ${esc(p.category)}</span> ${warned}
      <span style="margin-left:auto;font-size:12px;color:var(--fg-3)">${timeAgo(p.created_at)}</span></div>
    <div class="post-title"><a href="post.html?id=${p.id}" onclick="event.stopPropagation()">${esc(p.title)}</a></div>
    <div class="post-excerpt">${esc((p.summary && p.summary.trim()) ? p.summary : p.content)}</div>
    ${folded}
    <div class="post-meta"><span>${getIcon('like', 14)} ${p.like_count}</span><span>${getIcon('comment', 14)} ${p.comment_count}</span><span>${getIcon('credit', 14)} 信用 ${p.credit_score ?? '-'}</span></div>
  </div>`;
}

function videoCard(v) {
  return `<div class="video-card" onclick="location.href='video.html?id=${v.id}'">
    <div class="video-thumb"><img loading="lazy" class="cover-img" src="${videoCover(v)}" alt="" onerror="this.remove()"><span class="play-mask">${getIcon('video', 22)}</span></div>
    <div style="flex:1;min-width:0">
      <div class="v-title"><a href="video.html?id=${v.id}" onclick="event.stopPropagation()">${esc(v.title)}</a></div>
      <div class="v-desc">${esc(v.description || '')}</div>
      <div class="v-meta">${userLink(v.user_id, esc(v.nickname || ''))} · ${getIcon('video', 12)} ${v.view_count} · ${timeAgo(v.created_at)}</div>
    </div>
  </div>`;
}

async function loadSidebar() {
  try {
    const [hot, words, users] = await Promise.all([
      API.get('/api/posts?tab=hot&page_size=10'),
      API.get('/api/banned-words/top'),
      API.get('/api/posts/users/active'),
    ]);
    document.getElementById('hotList').innerHTML = hot.items.map((p, i) => `
      <li onclick="location.href='post.html?id=${p.id}'">
        <span class="rk">${i + 1}</span>
        <div class="r-main"><div class="r-title"><a href="post.html?id=${p.id}" onclick="event.stopPropagation()">${esc(p.title)}</a></div>
        <div class="r-sub">${esc(p.category)} · ${getIcon('like', 12)} ${p.like_count} · ${getIcon('comment', 12)} ${p.comment_count}</div></div>
      </li>`).join('') || '<div class="empty-tip">暂无热帖</div>';

    const ws = words.top_words || [];
    document.getElementById('wordList').innerHTML = ws.map((w, i) => `
      <li>
        <span class="rk">${i + 1}</span>
        <div class="r-main"><div class="r-title">${esc(w.word)}</div>
        <div class="r-sub">被拦截 ${w.count} 次</div></div>
      </li>`).join('') || '<div class="empty-tip">暂无违规记录</div>';

    document.getElementById('hToday').textContent = words.today_violations ?? 0;
    document.getElementById('hRate').textContent = (words.block_rate ?? 0) + '%';
    const lat = words.avg_latency_ms;
    document.getElementById('hLat').textContent = lat == null ? '-' : lat;
    document.getElementById('hLat').className = 'num' + (lat != null && lat > 50 ? ' red' : '');

    document.getElementById('userList').innerHTML = users.items.map((u, i) => `
      <li>
        <span class="rk">${i + 1}</span>
        <div class="r-main"><div class="r-title">${userLink(u.id, `<span class="avatar">${esc((u.nickname || u.username || '?').slice(0, 1))}</span> ${esc(u.nickname || u.username)}`)}
        <span class="credit">信用 ${u.credit_score}</span></div>
        <div class="r-sub">内容 ${u.activity} 次</div></div>
      </li>`).join('') || '<div class="empty-tip">暂无用户</div>';

    const base = `系统今日拦截 ${words.today_violations ?? 0} 条违规 · 累计 ${words.total_violations ?? 0} 次 · 高危 ${words.high_risk_count ?? 0} 次 · 拦截率 ${words.block_rate ?? 0}% · 最近高频违规词：`;
    const wordsText = (ws.map(w => `<span><span class="bad-word">${esc(w.word)}</span> ×${w.count}</span>`).join('')) || '<span>暂无</span>';
    document.getElementById('marquee').innerHTML = base + wordsText + base + wordsText;
  } catch (e) { /* 侧栏失败不阻塞主内容 */ }
}

// ===== 主页推荐轮播 =====
const carouselEl = document.getElementById('carousel');
const carouselTrack = document.getElementById('carouselTrack');
const carouselDots = document.getElementById('carouselDots');
let carouselTimer = null;
let carouselIdx = 0;
let carouselItems = [];

function goCarousel(idx) {
  if (!carouselItems.length) return;
  carouselIdx = (idx + carouselItems.length) % carouselItems.length;
  [...carouselTrack.children].forEach((s, i) => s.classList.toggle('active', i === carouselIdx));
  [...carouselDots.children].forEach((d, i) => d.classList.toggle('active', i === carouselIdx));
}
function startCarousel() {
  stopCarousel();
  carouselTimer = setInterval(() => goCarousel(carouselIdx + 1), 4500);
}
function stopCarousel() {
  if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
}

async function loadCarousel() {
  try {
    const res = await API.get('/api/carousel');
    const items = (res.items || []).filter(it => it.title);
    if (!items.length) return;
    carouselItems = items;
    carouselTrack.innerHTML = items.map((it, i) => `
      <a class="carousel-slide${i === 0 ? ' active' : ''}" href="${esc(it.url)}" data-idx="${i}">
        ${it.cover_url
          ? `<img class="carousel-img" src="${esc(it.cover_url)}" alt="" onerror="this.classList.add('hide');this.parentElement.classList.add('no-cover');this.remove()">`
          : `<div class="carousel-ph"><div class="ph-glyph">${getIcon(it.kind === 'post' ? 'post' : 'video', 34)}</div></div>`}
        <div class="carousel-info">
          <span class="carousel-tag">${it.is_pinned ? '置顶' : (it.kind === 'post' ? '帖子' : '视频')}</span>
          <div class="carousel-title">${esc(it.title)}</div>
          ${it.summary ? `<div class="carousel-summary">${esc(it.summary)}</div>` : ''}
        </div>
      </a>`).join('');
    carouselDots.innerHTML = items.map((_, i) => `<span class="carousel-dot${i === 0 ? ' active' : ''}" data-idx="${i}"></span>`).join('');
    carouselEl.style.display = 'block';
    carouselEl.classList.add('loaded');
    startCarousel();
  } catch (e) { /* 接口失败或空则保持隐藏 */ }
}

carouselEl.addEventListener('mouseenter', stopCarousel);
carouselEl.addEventListener('mouseleave', startCarousel);
document.getElementById('carouselPrev').addEventListener('click', () => { stopCarousel(); goCarousel(carouselIdx - 1); startCarousel(); });
document.getElementById('carouselNext').addEventListener('click', () => { stopCarousel(); goCarousel(carouselIdx + 1); startCarousel(); });
carouselDots.addEventListener('click', e => {
  const d = e.target.closest('.carousel-dot');
  if (!d) return;
  stopCarousel(); goCarousel(+d.dataset.idx); startCarousel();
});

loadFeed();
loadSidebar();
loadCarousel();
</script>
</body>
</html>
